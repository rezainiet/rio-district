# /etc/nginx/sites-available/kalt.conf — template, replace staging.example.com.
# TLS certificates: certbot --nginx -d staging.example.com

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.example.com;

    ssl_certificate     /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Admin image uploads are capped at 5 MB by the app.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The app checks Origin against Host for CSRF protection: keep the public host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rate limiting trusts X-Real-IP; it must come from the TCP connection, not the client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
