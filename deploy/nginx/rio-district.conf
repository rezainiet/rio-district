# /etc/nginx/sites-available/rio-district.conf — template.
# Replace www.example.com with the real domain (also in NEXT_PUBLIC_SITE_URL before `npm run build`).
# TLS certificates: certbot --nginx -d www.example.com -d example.com

server {
    listen 80;
    listen [::]:80;
    server_name www.example.com example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Do not advertise the nginx version.
    server_tokens off;

    # Admin image uploads are capped at 5 MB by the app; everything else is small JSON.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Shared proxy settings. The app compares Origin with Host (CSRF) and trusts
    # X-Real-IP for rate limiting: both MUST be set here from the real connection.
    # The app itself only listens on 127.0.0.1 (systemd unit), so nobody can bypass nginx.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;

    # Customer reviews may carry up to 3 photos of 6 MB each.
    location = /api/reviews {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
    }

    # Immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3000;
    }
}
